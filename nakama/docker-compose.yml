# VS-01 WP01 — LOCAL DEVELOPMENT ONLY. Disposable data; no cloud, no fees.
# Ports bind to 127.0.0.1 only. Credentials below are local defaults, not secrets.
name: myrial-vs01-wp01
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 20
  nakama:
    image: heroiclabs/nakama:3.25.0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        /nakama/nakama migrate up --database.address postgres:localdev@postgres:5432/nakama &&
        exec /nakama/nakama --config /nakama/data/local.yml
        --database.address postgres:localdev@postgres:5432/nakama
    volumes:
      - ./build:/nakama/data/modules:ro
      - ./config/local.yml:/nakama/data/local.yml:ro
    ports:
      - "127.0.0.1:17350:7350"
      - "127.0.0.1:17351:7351"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30
  # Second node on the SAME database, only for the multi-node rate-limit test
  # (`docker compose --profile multinode up -d`). Nakama OSS does not cluster
  # nodes; this only proves that state shared through PostgreSQL (rate limits,
  # progress, receipts) is enforced across separate server processes.
  nakama2:
    image: heroiclabs/nakama:3.25.0
    profiles: ["multinode"]
    depends_on:
      nakama:
        condition: service_healthy
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - >
        exec /nakama/nakama --config /nakama/data/local.yml --name myrial-local-2
        --database.address postgres:localdev@postgres:5432/nakama
    volumes:
      - ./build:/nakama/data/modules:ro
      - ./config/local.yml:/nakama/data/local.yml:ro
    ports:
      - "127.0.0.1:17360:7350"
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
