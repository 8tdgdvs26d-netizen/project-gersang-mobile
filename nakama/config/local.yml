# VS-01 WP01 local Nakama configuration. LOCAL DEVELOPMENT ONLY.
name: myrial-local
logger:
  level: INFO
runtime:
  path: /nakama/data/modules
  js_entrypoint: index.js
  env:
    # D1: email accounts are local test accounts only. Never set in production.
    - MYRIAL_ALLOW_EMAIL_TEST_AUTH=true
session:
  token_expiry_sec: 3600
  refresh_token_expiry_sec: 86400
  single_socket: true
social:
  apple:
    # Sign in with Apple audience check (D1). Same id as the iOS export preset.
    bundle_id: "com.charlie.myrial.unwritten"
