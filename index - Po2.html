<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>天下商旅 Prototype 002</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#16100b;color:#f4ead7;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;background:linear-gradient(#392619,#17100b);padding-bottom:82px}header{padding:16px;border-bottom:1px solid #755333;position:sticky;top:0;background:#24170fcc;backdrop-filter:blur(8px);z-index:3}h1,h2,h3{margin:0 0 8px}.sub{font-size:12px;color:#cbb99c}.screen{padding:15px}.hidden{display:none}.card{background:#2a1c12;border:1px solid #745333;border-radius:14px;padding:13px;margin:10px 0}button{border:1px solid #8b6841;background:#4b321e;color:#ffecc9;border-radius:10px;padding:10px 12px;font-weight:700;margin:3px}.primary{background:#765127}.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed #5d432b}.money{color:#f0ca78}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.map{height:330px;border-radius:18px;position:relative;overflow:hidden;border:1px solid #80613d;background:linear-gradient(135deg,#5b704e,#9a8c59 43%,#5e7459 44%,#355b4a)}.city{position:absolute;background:#27180fe8;border:1px solid #d0a56b;border-radius:11px;padding:8px;min-width:68px;text-align:center}.city small{display:block;color:#cdbd9f;font-size:10px}#edo{left:69%;top:16%}#nagoya{left:47%;top:38%}#kyoto{left:34%;top:55%}#osaka{left:21%;top:65%}#nagasaki{left:6%;top:84%}.market{display:grid;grid-template-columns:1fr auto auto;gap:4px;align-items:center;padding:7px 0;border-bottom:1px dashed #5d432b}.price{font-size:11px;color:#cdbb9e}.battle{min-height:220px;border-radius:16px;background:linear-gradient(#52634d,#302b1c);display:flex;align-items:center;justify-content:space-around}.unit{text-align:center;width:34%}.sprite{font-size:46px}.hp{height:8px;background:#17100b;border-radius:5px;overflow:hidden}.hp i{display:block;height:100%;background:#b94e38}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:grid;grid-template-columns:repeat(5,1fr);background:#21150e;border-top:1px solid #70502f;padding:6px 4px env(safe-area-inset-bottom)}.nav button{font-size:11px;padding:8px 2px}.tag{font-size:10px;color:#d2bd9d}
</style></head><body><div class="app"><header><h1>天下商旅</h1><div class="sub">PROJECT 巨商 MOBILE · Prototype 002 · 日本篇</div></header>
<section id="home" class="screen"><div class="card"><h2>日本篇 · 第一章</h2><p>從江戶出發，建立你的商旅隊伍。</p><div class="grid"><button class="primary" onclick="start('merchant')">💰 商人</button><button class="primary" onclick="start('fighter')">⚔️ 打手</button></div></div><div class="card"><h3>本版新增</h3><div class="sub">多貨物貨倉、負重、8 種貨物、城市物價、隊伍、戰鬥、升級、傭兵招募與自動保存。</div></div></section>
<section id="world" class="screen hidden"><h2>日本地圖</h2><div class="card"><div class="stat"><span>身份</span><b id="role"></b></div><div class="stat"><span>所在地</span><b id="loc"></b></div><div class="stat"><span>資金</span><b class="money" id="cash"></b></div></div><div class="map"><div class="city" id="edo"><b>江戶</b><small>市場・酒館</small></div><div class="city" id="nagoya"><b>名古屋</b><small>市場</small></div><div class="city" id="kyoto"><b>京都</b><small>市場・野外</small></div><div class="city" id="osaka"><b>大阪</b><small>市場・商會</small></div><div class="city" id="nagasaki"><b>長崎</b><small>港口</small></div></div><div class="card"><h3>前往</h3><div id="routes"></div></div></section>
<section id="market" class="screen hidden"><h2>市場 · <span id="mcity"></span></h2><div class="card"><div class="stat"><span>資金</span><b class="money" id="mcash"></b></div><div class="stat"><span>負重</span><b id="load"></b></div><div class="stat"><span>上限</span><b id="cap"></b></div></div><div class="card"><h3>貨物</h3><div id="goods"></div></div><div class="card"><h3>貨倉</h3><div id="cargo"></div></div></section>
<section id="battle" class="screen hidden"><h2>京都郊外 · 戰鬥</h2><div class="battle"><div class="unit"><div class="sprite" id="hero">⚔️</div><b>你</b><div class="hp"><i id="ph"></i></div><small id="pht"></small></div><div>⚔️</div><div class="unit"><div class="sprite" id="es">🐺</div><b id="en">野狼</b><div class="hp"><i id="eh"></i></div><small id="eht"></small></div></div><div class="card"><button class="primary" onclick="attack(28)">普通攻擊</button><button onclick="attack(48)">技能</button><button onclick="newEnemy()">尋找敵人</button></div></section>
<section id="party" class="screen hidden"><h2>傭兵隊伍</h2><div class="card"><div class="stat"><span>主角</span><b>Lv.<span id="lv"></span></b></div><div class="stat"><span>EXP</span><b id="xp"></b></div></div><div id="party"></div></section>
<section id="log" class="screen hidden"><h2>旅途紀錄</h2><div class="card" id="logs"></div></section>
<div class="nav"><button onclick="show('world')">🗾世界</button><button onclick="show('market')">🏪市場</button><button onclick="show('battle')">⚔️戰鬥</button><button onclick="show('party')">🧑‍🤝‍🧑隊伍</button><button onclick="show('log')">📜紀錄</button></div></div>
<script>
const cities=['江戶','名古屋','京都','大阪','長崎'],G={米:[100,1,'🌾'],茶:[180,1,'🍵'],鹽:[120,1,'🧂'],絹:[420,1,'🧵'],酒:[260,1,'🍶'],陶器:[340,2,'🏺'],魚乾:[150,1,'🐟'],藥材:[520,1,'🌿']};
const F={江戶:{米:1.4,茶:.8,鹽:1.1,絹:1.25,酒:.9,陶器:1.2,魚乾:.75,藥材:1.3},名古屋:{米:.75,茶:1.15,鹽:1,絹:.9,酒:1.2,陶器:.8,魚乾:1.1,藥材:1.05},京都:{米:1.1,茶:.7,鹽:1.15,絹:1.35,酒:.9,陶器:1.4,魚乾:.9,藥材:1.15},大阪:{米:.8,茶:1.05,鹽:.85,絹:1.15,酒:1.3,陶器:.9,魚乾:1.25,藥材:.95},長崎:{米:1.2,茶:1.3,鹽:1.05,絹:.75,酒:1.1,陶器:1.2,魚乾:1.35,藥材:.8}};
let S={role:null,city:'江戶',cash:10000,cargo:{},cap:30,lv:1,xp:0,hp:100,party:[],enemy:null,logs:[]};
function save(){localStorage.setItem('gersang002',JSON.stringify(S))}function load(){try{S={...S,...JSON.parse(localStorage.getItem('gersang002'))}}catch(e){}}
function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');if(id==='world')world();if(id==='market')market();if(id==='battle')battle();if(id==='party')party();if(id==='log')logs()}
function start(r){S={...S,role:r,city:'江戶',cash:10000,cargo:{},lv:1,xp:0,hp:100,party:[{name:'主角',icon:r==='merchant'?'🧑🏻‍💼':'⚔️',lv:1,hp:100}]};note('選擇身份：'+(r==='merchant'?'商人':'打手'));show('world')}
function note(x){S.logs.unshift(new Date().toLocaleTimeString()+' · '+x);S.logs=S.logs.slice(0,50);save()}
function world(){role.textContent=S.role==='merchant'?'商人':'打手';loc.textContent=S.city;cash.textContent='¥'+S.cash.toLocaleString();routes.innerHTML=cities.filter(c=>c!==S.city).map(c=>`<button onclick="travel('${c}')">前往 ${c}</button>`).join('')}
function travel(c){let cost=300+Math.abs(cities.indexOf(c)-cities.indexOf(S.city))*150;if(S.cash<cost)return alert('資金不足，旅費 ¥'+cost);S.cash-=cost;S.city=c;note('前往 '+c+'，旅費 ¥'+cost);world()}
function loadWt(){return Object.entries(S.cargo).reduce((a,[g,q])=>a+G[g][1]*q,0)}function pr(g){return Math.round(G[g][0]*F[S.city][g])}
function market(){mcity.textContent=S.city;mcash.textContent='¥'+S.cash.toLocaleString();load.textContent=loadWt();cap.textContent=S.cap;goods.innerHTML=Object.entries(G).map(([g,d])=>`<div class="market"><div>${d[2]} <b>${g}</b><div class="price">¥${pr(g)} · 重量 ${d[1]}</div></div><button onclick="buy('${g}')">買 1</button><button onclick="sell('${g}')">賣 1</button></div>`).join('');let e=Object.entries(S.cargo);cargo.innerHTML=e.length?e.map(([g,q])=>`<div class="stat"><span>${G[g][2]} ${g}</span><b>×${q}</b></div>`).join(''):'<div class="sub">貨倉空空如也</div>'}
function buy(g){let p=pr(g),d=G[g];if(S.cash<p)return alert('錢唔夠');if(loadWt()+d[1]>S.cap)return alert('負重已滿');S.cash-=p;S.cargo[g]=(S.cargo[g]||0)+1;note('買入 '+g+' ×1，花費 ¥'+p);market()}
function sell(g){let q=S.cargo[g]||0;if(!q)return alert('貨倉冇呢樣貨');let p=pr(g);if(--S.cargo[g]===0)delete S.cargo[g];S.cash+=p;note('賣出 '+g+' ×1，收入 ¥'+p);market()}
function party(){lv.textContent=S.lv;xp.textContent=S.xp+'/100';document.getElementById('party').innerHTML=S.party.map(u=>`<div class="card"><div class="stat"><span class="sprite">${u.icon} ${u.name}</span><b>Lv.${u.lv}</b></div><div class="stat"><span>HP</span><b>${u.hp}</b></div></div>`).join('')+(S.lv>=2&&S.party.length<2?'<div class="card"><h3>🥷 忍者</h3><div class="tag">第一位可招募傭兵</div><br><button class="primary" onclick="recruit()">招募 · ¥1,500</button></div>':'')}
function recruit(){if(S.cash<1500)return alert('錢唔夠');S.cash-=1500;S.party.push({name:'忍者',icon:'🥷',lv:1,hp:90});note('招募忍者加入隊伍');party()}
function newEnemy(){S.enemy={name:['野狼','山賊','野豬'][Math.floor(Math.random()*3)],hp:100,max:100,atk:8};battle()}
function battle(){if(!S.enemy)newEnemy();hero.textContent=S.role==='merchant'?'🧑🏻‍💼':'⚔️';en.textContent=S.enemy.name;es.textContent=S.enemy.name==='野豬'?'🐗':S.enemy.name==='山賊'?'🗡️':'🐺';eh.style.width=(S.enemy.hp/S.enemy.max*100)+'%';eht.textContent=S.enemy.hp+'/'+S.enemy.max;ph.style.width=S.hp+'%';pht.textContent=S.hp+'/100'}
function attack(dmg){if(!S.enemy)newEnemy();S.enemy.hp=Math.max(0,S.enemy.hp-dmg-S.lv*2);if(S.enemy.hp===0)return win();S.hp=Math.max(0,S.hp-S.enemy.atk);if(S.hp===0){note('被擊倒，返回休整');S.hp=100;S.enemy=null}battle()}
function win(){let gain=35+S.lv*10,reward=180+S.lv*40;S.xp+=gain;S.cash+=reward;note('擊敗 '+S.enemy.name+'，EXP +'+gain+'，收入 +¥'+reward);S.enemy=null;if(S.xp>=100){S.xp-=100;S.lv++;S.party[0].lv=S.lv;note('🎉 升級至 Lv.'+S.lv)}battle();save()}
function logs(){document.getElementById('logs').innerHTML=S.logs.map(x=>'<div style="padding:5px 0;border-bottom:1px dashed #5d432b">'+x+'</div>').join('')||'<div class="sub">暫無紀錄</div>'}
load();if(!S.role)show('home');else show('world');
</script></body></html>
