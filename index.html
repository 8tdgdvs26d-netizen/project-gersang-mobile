<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>天下商旅 004</title><style>
*{box-sizing:border-box}body{margin:0;background:#17130f;color:#f4ead5;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}button{font:inherit;border:0;border-radius:10px;padding:11px;background:#8d5b2e;color:white;font-weight:700}button:disabled{opacity:.35}h1,h2,h3,p{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;background:#211a14}.top{padding:14px;background:#332318;border-bottom:1px solid #72502f;position:sticky;top:0;z-index:3}.title{font-size:23px;font-weight:900}.sub{font-size:12px;color:#cdbb9d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.stat{background:#241b14;border:1px solid #59402a;border-radius:8px;padding:6px;font-size:11px}.stat b{display:block;color:#ffd98c;font-size:13px}.screen{padding:12px 12px 92px}.panel{background:#2a2119;border:1px solid #62462c;border-radius:12px;padding:12px;margin-bottom:10px}.row{display:flex;gap:8px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.world{height:290px;position:relative;background:radial-gradient(circle at 50% 45%,#5e5739,#25291d 65%);border-radius:12px;overflow:hidden;border:2px solid #70583a}.road{position:absolute;height:3px;background:#b29a70;transform-origin:left center;opacity:.65}.city{position:absolute;width:76px;text-align:center;transform:translate(-50%,-50%)}.city button{width:60px;height:60px;border-radius:50%;background:#5b3b22;border:2px solid #d2a765;font-size:25px;padding:0}.city small{display:block;margin-top:3px;font-weight:800}.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(4,1fr);background:#201710;border-top:1px solid #62462c;padding:7px;z-index:5}.tabbar button{background:#3a2b1d;padding:9px 4px;font-size:12px}.tabbar button.active{background:#9b6735}.item{padding:9px 0;border-bottom:1px solid #4b3827}.item:last-child{border:0}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#4a3826;font-size:11px}.log{max-height:130px;overflow:auto;font-size:12px;line-height:1.65;color:#d6c7ad}.enemy{font-size:46px;text-align:center;padding:12px}.hp{height:9px;background:#160f0b;border-radius:99px;overflow:hidden}.hp i{display:block;height:100%;background:#b75a4e}.xp i{background:#6f9fbe}.modal{position:fixed;inset:0;background:#0009;z-index:10;display:none;align-items:flex-end}.modal.show{display:flex}.sheet{width:min(520px,100%);margin:auto;background:#2a2119;border:1px solid #705032;border-radius:18px 18px 0 0;padding:16px;max-height:88vh;overflow:auto}.muted{color:#bcae97;font-size:12px}.good{font-size:20px}.danger{background:#6f3c35}.green{background:#52704b}
</style></head><body><div class="app"><header class="top"><div class="title">天下商旅 · Project 004</div><div class="sub">東洋商路 × 傭兵並肩作戰 × 任務</div><div class="stats"><div class="stat">金錢<b id="cash">¥0</b></div><div class="stat">等級<b id="lv">Lv.1</b></div><div class="stat">體力<b id="hp">30/30</b></div><div class="stat">負重<b id="cap">0/35</b></div></div></header><main id="screen" class="screen"></main><nav class="tabbar"><button data-tab="world">🗺️ 世界</button><button data-tab="city">🏯 城市</button><button data-tab="party">⚔️ 隊伍</button><button data-tab="more">📜 資料</button></nav></div><div id="modal" class="modal"><div class="sheet" id="sheet"></div></div><script>
const CITIES={江戶:{x:78,y:26,icon:'🏯',f:{米:1.05,茶:1.45,鹽:.85,絹:1.3,酒:.9,陶器:1.15,魚乾:.95,藥材:1.25,紙:1.2,鐵:1.1,香料:1.4,珠:1.5}},名古屋:{x:55,y:43,icon:'🏮',f:{米:.9,茶:1.05,鹽:1.2,絹:1.15,酒:.8,陶器:1.25,魚乾:1.1,藥材:1.05,紙:1.3,鐵:1.35,香料:1.25,珠:1.15}},京都:{x:30,y:37,icon:'⛩️',f:{米:1.2,茶:.8,鹽:1.1,絹:.85,酒:1.35,陶器:.9,魚乾:1.05,藥材:1.3,紙:.85,鐵:1.25,香料:1.1,珠:1.3}},大阪:{x:24,y:65,icon:'🧱',f:{米:1.15,茶:1.25,鹽:.8,絹:1.05,酒:.75,陶器:.85,魚乾:1.3,藥材:1.15,紙:1.1,鐵:.9,香料:1.35,珠:1.25}},長崎:{x:72,y:78,icon:'⚓',f:{米:1.3,茶:1.2,鹽:1.15,絹:1.4,酒:1.25,陶器:1.3,魚乾:.8,藥材:.85,紙:1.2,鐵:.75,香料:.65,珠:.8}}};
const GOODS={米:[100,1,'🌾'],茶:[180,1,'🍵'],鹽:[120,1,'🧂'],絹:[420,2,'🧵'],酒:[260,2,'🍶'],陶器:[340,2,'🏺'],魚乾:[150,1,'🐟'],藥材:[520,1,'🌿'],紙:[220,1,'📜'],鐵:[300,3,'⛓️'],香料:[650,1,'🌶️'],珠:[900,1,'🔮']};
const ENEMIES=[['野狼','🐺',34,7,70],['山賊','🗡️',48,10,110],['野豬','🐗',62,12,145],['妖狐','🦊',78,15,210]];
let S=JSON.parse(localStorage.getItem('gersang003')||'null')||{cash:10000,lv:1,xp:0,hp:30,maxhp:30,cap:35,city:'江戶',cargo:{},role:'商人',party:[{name:'主角',lv:1,hp:30,maxhp:30,atk:8}],mercs:[],quests:{trade:0,battle:0},logs:['踏上東洋商路。']};
const save=()=>{localStorage.setItem('gersang003',JSON.stringify(S));render()};const weight=()=>Object.entries(S.cargo).reduce((a,[g,n])=>a+n*GOODS[g][1],0);const price=g=>Math.round(GOODS[g][0]*CITIES[S.city].f[g]*(.92+Math.random()*.16));
function log(x){S.logs.unshift(x);S.logs=S.logs.slice(0,30)}function gainXP(n){S.xp+=n;while(S.xp>=S.lv*100){S.xp-=S.lv*100;S.lv++;S.maxhp+=5;S.hp=S.maxhp;S.party[0].lv=S.lv;S.party[0].maxhp=S.maxhp;S.party[0].hp=S.maxhp;S.party[0].atk+=2;log('🎉 升級!現在 Lv.'+S.lv)}}
function gainMercXP(m,n){m.xp=(m.xp||0)+n;while(m.xp>=m.lv*80){m.xp-=m.lv*80;m.lv++;m.maxhp+=4;m.hp=m.maxhp;m.atk+=2;log(`🥷 ${m.name} 升級!現在 Lv.${m.lv}`)}}
function allies(){return [S.party[0],...S.mercs]}
function header(){document.querySelector('#cash').textContent='¥'+S.cash.toLocaleString();document.querySelector('#lv').textContent='Lv.'+S.lv;document.querySelector('#hp').textContent=S.hp+'/'+S.maxhp;document.querySelector('#cap').textContent=weight()+'/'+S.cap}
function render(){header();let tab=document.querySelector('.active')?.dataset.tab||'world';document.querySelectorAll('.tabbar button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));({world:world,city:city,party:party,more:more}[tab])()}
function world(){let roads='';let arr=Object.entries(CITIES);for(let i=0;i<arr.length-1;i++){let a=arr[i][1],b=arr[i+1][1];let dx=b.x-a.x,dy=b.y-a.y,len=Math.hypot(dx,dy);roads+=`<div class="road" style="left:${a.x}%;top:${a.y}%;width:${len/0.19}%;transform:rotate(${Math.atan2(dy,dx)}rad)"></div>`}document.querySelector('#screen').innerHTML=`<div class="panel"><div class="between"><div><b>東洋全圖</b><div class="muted">目前:${S.city} · ${S.role}</div></div><button onclick="openCity()">進入城市</button></div></div><div class="world">${roads}${Object.entries(CITIES).map(([n,c])=>`<div class="city" style="left:${c.x}%;top:${c.y}%"><button onclick="travel('${n}')">${c.icon}</button><small>${n}</small></div>`).join('')}</div><div class="panel"><h3>📌 商路情報</h3><p class="muted" style="margin-top:6px">城市之間有不同物價。真正的玩法不是「買了就賣」,而是研究路線、負重、資金與風險。</p></div><div class="panel"><h3>📖 紀錄</h3><div class="log">${S.logs.map(x=>`<div>${x}</div>`).join('')}</div></div>`}
function travel(n){if(n===S.city)return;let cost=300+Math.abs(CITIES[n].x-CITIES[S.city].x)*8; if(S.cash<cost){alert('盤纏不足');return}S.cash-=Math.round(cost);let old=S.city;S.city=n;S.hp=Math.max(1,S.hp-1);S.party[0].hp=S.hp;log(`🚶 從${old}前往${n},花費 ¥${Math.round(cost)}`);save()}
function city(){document.querySelector('#screen').innerHTML=`<div class="panel"><h2>${CITIES[S.city].icon} ${S.city}</h2><div class="muted" style="margin-top:5px">商會、酒場、野外、委託都在這裡。</div></div><div class="grid"><button onclick="market()">🛒 市場</button><button onclick="tavern()">🍶 酒場</button><button onclick="wild()">🌲 野外</button><button onclick="quest()">📜 委託</button></div><div class="panel" style="margin-top:10px"><h3>🧳 貨物</h3>${Object.keys(S.cargo).length?Object.entries(S.cargo).map(([g,n])=>`<div class="item between"><span>${GOODS[g][2]} ${g} ×${n}</span><b>¥${n*price(g)}</b></div>`).join(''):'<div class="muted">空手。商人也會有兩手空空的時候。</div>'}</div>`}
function market(){let rows=Object.entries(GOODS).map(([g,v])=>{let p=price(g),n=S.cargo[g]||0;return `<div class="item"><div class="between"><span class="good">${v[2]} <b>${g}</b></span><span>¥${p} · ${v[1]}重</span></div><div class="between" style="margin-top:6px"><span class="muted">持有 ${n}</span><span><button onclick="buy('${g}',${p})">買</button> <button onclick="sell('${g}',${p})" class="green">賣</button></span></div></div>`}).join('');openSheet(`<div class="between"><h2>🛒 ${S.city}市場</h2><button onclick="closeSheet()">關閉</button></div><p class="muted" style="margin:8px 0">價格每次查看會有小幅波動。容量:${weight()}/${S.cap}</p>${rows}`)}
function buy(g,p){let w=GOODS[g][1];if(S.cash<p||weight()+w>S.cap){alert(S.cash<p?'金錢不足':'負重不足');return}S.cash-=p;S.cargo[g]=(S.cargo[g]||0)+1;log(`🛒 買入 ${g} ×1,¥${p}`);save();market()}
function sell(g,p){if(!S.cargo[g])return;S.cash+=p;S.cargo[g]--;if(!S.cargo[g])delete S.cargo[g];S.quests.trade++;log(`💰 賣出 ${g} ×1,¥${p}`);gainXP(5);save();market()}
function tavern(){openSheet(`<h2>🍶 酒場</h2><p class="muted" style="margin:8px 0">傳聞:商人真正害怕的不是妖怪,是買錯貨之後的回程。</p><div class="panel"><b>招募忍者</b><p class="muted">Lv.1 · 攻擊 10 · 速度型傭兵。落場打交會同你並肩作戰。</p><button style="margin-top:8px" onclick="recruit()" ${S.mercs.length?'disabled':''}>¥1,200 招募</button></div>`)}
function recruit(){if(S.mercs.length||S.cash<1200)return alert('無法招募');S.cash-=1200;S.mercs.push({name:'忍者',lv:1,hp:24,maxhp:24,atk:10,xp:0});log('🥷 招募了忍者!');save();closeSheet()}
function wild(){openSheet(`<h2>🌲 野外</h2><p class="muted" style="margin:8px 0">離開城門,進入隨機遭遇戰。你嘅全隊(主角+傭兵)會一齊上陣。</p>${ENEMIES.map((e,i)=>`<button style="width:100%;margin:4px 0" onclick="battle(${i})">${e[1]} ${e[0]} · Lv.${i+1}</button>`).join('')}`)}
function battle(i){let e=ENEMIES[i];closeSheet();window.B={i,ehp:e[2],emax:e[2],msg:'選擇行動,全隊一齊出手。'};openSheet(battleView())}
function battleView(){let e=ENEMIES[B.i];let rows=allies().map((a,idx)=>{let down=a.hp<=0;return `<div class="between" style="margin-top:8px"><span>${idx===0?'⚔️':'🥷'} ${a.name} <span class="pill">Lv.${a.lv}</span></span><span class="muted">${down?'倒下':`HP ${a.hp}/${a.maxhp}`}</span></div><div class="hp"><i style="width:${Math.max(0,a.hp/a.maxhp*100)}%"></i></div>`}).join('');return `<div class="between"><h2>⚔️ 遭遇:${e[1]} ${e[0]}</h2><button onclick="closeSheet()">逃跑</button></div><div class="enemy">${e[1]}</div><div class="hp"><i style="width:${Math.max(0,B.ehp/B.emax*100)}%"></i></div><p class="muted" style="margin:8px 0 4px">敵人 HP ${Math.max(0,B.ehp)}/${B.emax}</p><div class="panel" style="margin:10px 0"><b>我方隊伍</b>${rows}</div><p class="muted" style="margin:6px 0">${B.msg}</p><div class="grid"><button onclick="partyAttack(1)">普通攻擊</button><button onclick="partyAttack(2)">重擊</button><button onclick="partyGuard()">防禦</button><button onclick="partyAttack(3)">技能</button></div>`}
function partyAttack(type){if(!window.B||B.over)return;let e=ENEMIES[B.i];let living=allies().filter(a=>a.hp>0);if(!living.length)return;let dmg=living.reduce((sum,a)=>sum+(type===2?a.atk+7:type===3?a.atk+12:a.atk),0);B.ehp-=dmg;let tag=type===2?'💥 全隊重擊':type===3?'✨ 全隊技能':'⚔️ 全隊攻擊';if(B.ehp<=0){B.over=true;let reward=e[4];S.cash+=reward;gainXP(35+B.i*20);S.mercs.forEach(m=>gainMercXP(m,20+B.i*10));S.quests.battle++;log(`🏆 擊敗${e[0]},獲得 ¥${reward}`);save();setTimeout(closeSheet,600);return}let ed=Math.max(1,e[3]-(type===3?3:0));enemyStrike(ed,`${tag}造成 ${dmg} 傷害`)}
function partyGuard(){if(!window.B||B.over)return;let e=ENEMIES[B.i];let ed=Math.max(1,Math.floor(e[3]/2));enemyStrike(ed,'🛡️ 全隊防禦,傷害減半')}
function enemyStrike(ed,msg){let living=allies().filter(a=>a.hp>0);let target=living[Math.floor(Math.random()*living.length)];target.hp=Math.max(0,target.hp-ed);let who=target===S.party[0]?target.name:`🥷${target.name}`;B.msg=`${msg},${who} 受到 ${ed} 傷害`;if(target.hp<=0)B.msg+=`,${who} 倒下!`;S.hp=S.party[0].hp;if(!allies().some(a=>a.hp>0)){B.over=true;B.msg+=' 全隊倒下,狼狽撤退。';allies().forEach(a=>a.hp=1);S.hp=1;log('💫 全隊被打倒,狼狽返回城市。');save();setTimeout(closeSheet,700);return}header();document.querySelector('#sheet').innerHTML=battleView()}
function quest(){openSheet(`<h2>📜 城市委託</h2><p class="muted">完成條件可獲得金錢與經驗。</p><div class="item"><b>商路學徒</b><p class="muted">累計交易 5 件貨物:${Math.min(5,S.quests.trade)}/5</p><button onclick="claim('trade')" ${S.quests.trade>=5?'':'disabled'}>領取 ¥800 + EXP</button></div><div class="item"><b>城外清掃</b><p class="muted">完成 3 場戰鬥:${Math.min(3,S.quests.battle)}/3</p><button onclick="claim('battle')" ${S.quests.battle>=3?'':'disabled'}>領取 ¥1,000 + EXP</button></div>`)}
function claim(k){if(k==='trade'&&S.quests.trade>=5){S.quests.trade=-999;S.cash+=800;gainXP(100);log('📜 完成商路學徒委託。')}else if(k==='battle'&&S.quests.battle>=3){S.quests.battle=-999;S.cash+=1000;gainXP(120);log('📜 完成城外清掃委託。')}save();quest()}
function party(){let main=S.party[0];let mercRows=S.mercs.map(m=>{m.xp=m.xp||0;return `<div class="panel"><div class="between"><b>🥷 ${m.name}</b><span class="pill">Lv.${m.lv}</span></div><p class="muted" style="margin-top:5px">HP ${m.hp}/${m.maxhp} · ATK ${m.atk}</p><div class="hp xp" style="margin-top:6px"><i style="width:${Math.min(100,m.xp/(m.lv*80)*100)}%"></i></div><p class="muted" style="margin-top:4px">EXP ${m.xp}/${m.lv*80}</p></div>`}).join('')||'<div class="panel muted">尚未有傭兵。到酒場招募。</div>';document.querySelector('#screen').innerHTML=`<div class="panel"><h2>⚔️ 隊伍編成</h2><p class="muted" style="margin-top:5px">主角同傭兵而家會一齊落場打交,傭兵都會自己儲 EXP、自己升級。</p></div><div class="panel"><div class="between"><b>⚔️ ${main.name}</b><span class="pill">Lv.${main.lv}</span></div><p class="muted" style="margin-top:5px">HP ${main.hp}/${main.maxhp} · ATK ${main.atk}</p></div>${mercRows}<div class="panel"><b>隊伍後續方向</b><p class="muted" style="margin-top:7px">進階、技能書、裝備、陣形、更多傭兵職業。</p></div>`}
function more(){document.querySelector('#screen').innerHTML=`<div class="panel"><h2>📜 遊戲資料</h2><div class="item"><b>角色</b><div class="muted">商人:經濟與負重。戰鬥能力較低。</div></div><div class="item"><b>經濟</b><div class="muted">12種貨物 × 5城市 × 價格波動 × 重量 × 路線。</div></div><div class="item"><b>戰鬥</b><div class="muted">全隊(主角+傭兵)一齊攻防,傭兵有獨立 HP 同 EXP,會自己升級。</div></div><div class="item"><b>版本方向</b><div class="muted">世界地圖 → 城市生活 → 商路 → 傭兵並肩作戰 → 任務 → 裝備 → 更深層經濟。</div></div></div><div class="panel"><button class="danger" style="width:100%" onclick="if(confirm('清除全部進度?')){localStorage.removeItem('gersang003');location.reload()}">重置遊戲</button></div>`}
function openCity(){document.querySelector('[data-tab="city"]').click()}function openSheet(x){document.querySelector('#sheet').innerHTML=x;document.querySelector('#modal').classList.add('show')}function closeSheet(){document.querySelector('#modal').classList.remove('show');window.B=null;render()}document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});render();
</script></body></html>
