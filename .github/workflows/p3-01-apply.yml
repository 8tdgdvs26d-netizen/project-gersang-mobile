name: p3-01-apply
on:
  push:
    branches:
      - gpt/p3-01-six-goods-economy-foundation
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fix helper template escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/p3-01-apply.mjs')
          s=p.read_text()
          s=s.replace(r'\\${name}', r'\${name}').replace(r'\\${type}', r'\${type}')
          start=s.index("const testFile=`")
          end=s.index("`;\nmkdirSync('test'", start)
          segment=s[start:end]
          segment=segment.replace('${', r'\${')
          s=s[:start]+segment+s[end:]
          p.write_text(s)
          PY
      - run: node scripts/p3-01-apply.mjs
      - run: npm test
      - name: Commit generated P3-01 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add P3-01 six-goods economy foundation"
          git push
