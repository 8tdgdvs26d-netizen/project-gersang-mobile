name: ci-movement-timing-fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply test-only timing repair
        run: node scripts/ci-movement-timing-fix.mjs
      - name: Remove temporary repair scaffolding
        run: rm scripts/ci-movement-timing-fix.mjs .github/workflows/ci-movement-timing-fix.yml
      - name: Run full test suite
        run: npm test
      - name: Commit test-only repair
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/world-movement.test.mjs scripts/ci-movement-timing-fix.mjs .github/workflows/ci-movement-timing-fix.yml
          git commit -m "test: make movement cadence timing deterministic"
          git push origin HEAD:gpt/ci-movement-timing-flake-fix
