name: p3-closeout-test-fix

on:
  push:
    branches:
      - gpt/p3-closeout-economy-consistency

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/p3-closeout-economy-consistency
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply test-only deterministic throttle coverage
        shell: python
        run: |
          from pathlib import Path

          movement = Path('test/world-movement.test.mjs')
          text = movement.read_text()
          block = """test('a command sent sooner than the minimum movement interval produces no additional displacement',async()=>{\n  await wait(150);\n  const first=await post('/api/commands/world/move',envelope('move-throttle-a',{targetX:500,targetY:500}));\n  assert.equal(first.status,'ACCEPTED');\n  assert.equal(first.data.throttled,false);\n  const second=await post('/api/commands/world/move',envelope('move-throttle-b',{targetX:900,targetY:900}));\n  assert.equal(second.status,'ACCEPTED');\n  assert.equal(second.data.throttled,true);\n  assert.deepEqual(second.data.worldPosition,first.data.worldPosition);\n});\n\n"""
          if block not in text:
              raise SystemExit('world-movement throttle block not found')
          movement.write_text(text.replace(block, '', 1))

          persistence = Path('test/world-persistence.test.mjs')
          text = persistence.read_text()
          block = """test('throttle: the first move is accepted and establishes lastWorldMoveAt, the immediate second move is genuinely throttled, and a direct DB read proves the second command made literally zero additional write',async()=>{\n  setPosition(50,50,'IN_WORLD');\n  await wait(150);\n  const first=await post('/api/commands/world/move',envelope('persist-throttle-first',{targetX:90,targetY:50}));\n  assert.equal(first.status,'ACCEPTED');\n  assert.equal(first.data.throttled,false);\n  assert.deepEqual(first.data.worldPosition,{x:90,y:50});\n  const rowAfterFirst=readCharacterRow();\n  assert.equal(rowAfterFirst.world_x,90);\n  assert.equal(rowAfterFirst.world_y,50);\n  assert.equal(rowAfterFirst.state,'IN_WORLD');\n  const second=await post('/api/commands/world/move',envelope('persist-throttle-second',{targetX:900,targetY:900}));\n  assert.equal(second.status,'ACCEPTED');\n  assert.equal(second.data.throttled,true);\n  assert.deepEqual(second.data.worldPosition,{x:90,y:50});\n  const rowAfterSecond=readCharacterRow();\n  assert.deepEqual(rowAfterSecond,rowAfterFirst,'the throttled command must not have changed the characters row at all');\n});\n\n"""
          if block not in text:
              raise SystemExit('world-persistence throttle block not found')
          persistence.write_text(text.replace(block, '', 1))

          Path('test/fake-clock-preload.mjs').write_text("""let fakeNow = 1_000_000;\nDate.now = () => fakeNow++;\n""")

          Path('test/world-throttle-deterministic.test.mjs').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport {spawn} from 'node:child_process';\nimport {mkdtemp,rm} from 'node:fs/promises';\nimport {tmpdir} from 'node:os';\nimport {join} from 'node:path';\nimport {fileURLToPath} from 'node:url';\nimport {DatabaseSync} from 'node:sqlite';\n\nconst requestJson=async(base,path,options={})=>{const r=await fetch(base+path,{headers:{'content-type':'application/json'},...options});return r.json()};\n\ntest('world/move minimum interval throttles a back-to-back command deterministically and makes zero extra DB write',async()=>{\n  const dir=await mkdtemp(join(tmpdir(),'myrial-world-throttle-deterministic-'));\n  const dbPath=join(dir,'test.sqlite');\n  const preload=fileURLToPath(new URL('./fake-clock-preload.mjs',import.meta.url));\n  const child=spawn(process.execPath,['--import',preload,'server.mjs'],{cwd:new URL('..',import.meta.url),env:{...process.env,PORT:'0',DB_PATH:dbPath},stdio:['ignore','pipe','inherit']});\n  try{\n    const line=await new Promise((resolve,reject)=>{child.stdout.on('data',b=>{const s=b.toString();if(s.includes('FIRST_PLAYABLE_READY'))resolve(s)});child.on('exit',code=>reject(new Error(`server exited ${code}`)))});\n    const base=`http://127.0.0.1:${line.match(/:(\\d+)/)[1]}`;\n    const post=(path,body)=>requestJson(base,path,{method:'POST',body:JSON.stringify(body)});\n    const sessionId=(await post('/api/session/open',{accountId:'account-demo'})).sessionId;\n    const envelope=(key,payload)=>({commandId:crypto.randomUUID(),idempotencyKey:key,sessionId,characterId:'char-demo',clientSentAt:new Date().toISOString(),payload});\n    const fixture=new DatabaseSync(dbPath);\n    fixture.prepare(`UPDATE characters SET world_x=50,world_y=50,state='IN_WORLD' WHERE id='char-demo'`).run();\n    fixture.close();\n\n    const first=await post('/api/commands/world/move',envelope('det-throttle-first',{targetX:90,targetY:50}));\n    assert.equal(first.status,'ACCEPTED');\n    assert.equal(first.data.throttled,false);\n    assert.deepEqual(first.data.worldPosition,{x:90,y:50});\n\n    const beforeSecond=new DatabaseSync(dbPath);\n    const rowAfterFirst=beforeSecond.prepare(`SELECT world_x,world_y,state FROM characters WHERE id='char-demo'`).get();\n    beforeSecond.close();\n\n    const second=await post('/api/commands/world/move',envelope('det-throttle-second',{targetX:900,targetY:900}));\n    assert.equal(second.status,'ACCEPTED');\n    assert.equal(second.data.throttled,true);\n    assert.deepEqual(second.data.worldPosition,first.data.worldPosition);\n\n    const afterSecond=new DatabaseSync(dbPath);\n    const rowAfterSecond=afterSecond.prepare(`SELECT world_x,world_y,state FROM characters WHERE id='char-demo'`).get();\n    afterSecond.close();\n    assert.deepEqual(rowAfterSecond,rowAfterFirst,'throttled command must make zero additional characters-row write');\n  }finally{\n    child.kill();\n    await new Promise(resolve=>child.once('exit',resolve));\n    await rm(dir,{recursive:true,force:true});\n  }\n});\n""")

          Path('.github/workflows/p3-closeout-test-fix.yml').unlink()
      - name: Run full test suite
        run: npm test
      - name: Commit deterministic test-only fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "test: make movement throttle coverage deterministic"
          git push origin HEAD:gpt/p3-closeout-economy-consistency
