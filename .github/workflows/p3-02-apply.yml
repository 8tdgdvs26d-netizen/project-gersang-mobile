name: p3-02-apply

on:
  push:
    branches:
      - gpt/p3-02-batch-repricing-trade-validation

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply P3-02 approved changes
        run: node scripts/p3-02-apply.mjs
      - name: Remove temporary implementation scaffolding
        run: rm scripts/p3-02-apply.mjs .github/workflows/p3-02-apply.yml
      - name: Run full test suite
        run: npm test
      - name: Commit approved implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: P3-02 batch repricing and Chinese market names"
          git push origin HEAD:gpt/p3-02-batch-repricing-trade-validation
