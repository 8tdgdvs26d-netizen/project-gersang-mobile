name: cp002-backup-export

on:
  push:
    branches: [infra/cp001-backup-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build CP-002 source snapshot
        run: |
          git archive --format=zip --output=CP-002-source-c63a528c.zip c63a528cba778f17aa2d25646eed5e29c6feb048
          git bundle create CP-002-full-history.bundle --all
          printf 'CP-002 Free World Complete\nSHA: c63a528cba778f17aa2d25646eed5e29c6feb048\nGenerated by GitHub Actions backup export workflow.\n' > CP-002-BACKUP-README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CP-002-Free-World-Complete-backup
          path: |
            CP-002-source-c63a528c.zip
            CP-002-full-history.bundle
            CP-002-BACKUP-README.txt
          if-no-files-found: error
          retention-days: 30
