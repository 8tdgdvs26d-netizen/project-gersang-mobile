name: cp001-backup-export

on:
  push:
    branches: [infra/cp001-backup-export]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build CP-001 source snapshot
        run: |
          git archive --format=zip --output=CP-001-source-77b77a24.zip 77b77a24fe97488ba8ec3d6f5df731c2cca33c17
          git bundle create CP-001-full-history.bundle --all
          printf 'CP-001\nSHA: 77b77a24fe97488ba8ec3d6f5df731c2cca33c17\nGenerated by GitHub Actions backup export workflow.\n' > CP-001-BACKUP-README.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CP-001-Rebaseline-v0.5-backup
          path: |
            CP-001-source-77b77a24.zip
            CP-001-full-history.bundle
            CP-001-BACKUP-README.txt
          if-no-files-found: error
          retention-days: 30
